<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="900" height="280" rx="16" fill="url(#bgGrad4)" />

  <!-- Hub in Center -->
  <g filter="url(#shadow4)">
    <circle cx="450" cy="140" r="60" fill="#111827" stroke="#10b981" stroke-width="3"/>
    <text x="450" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#34d399" text-anchor="middle">SCHEMA</text>
    <text x="450" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#34d399" text-anchor="middle">BRIDGE</text>
  </g>

  <!-- Left Top: MCP -->
  <g filter="url(#shadow4)">
    <rect x="60" y="40" width="180" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="150" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">MCP Standard</text>
    <text x="150" y="95" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">inputSchema</text>
  </g>
  <line x1="240" y1="80" x2="395" y2="120" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Right Top: Google Gemini -->
  <g filter="url(#shadow4)">
    <rect x="660" y="40" width="180" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="750" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Google Gemini</text>
    <text x="750" y="95" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">OBJECT, STRING (Upper)</text>
  </g>
  <line x1="660" y1="80" x2="505" y2="120" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Left Bottom: OpenAI -->
  <g filter="url(#shadow4)">
    <rect x="60" y="165" width="180" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="150" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#10b981" text-anchor="middle">OpenAI Tools</text>
    <text x="150" y="220" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">function.parameters</text>
  </g>
  <line x1="240" y1="200" x2="395" y2="160" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Right Bottom: Anthropic -->
  <g filter="url(#shadow4)">
    <rect x="660" y="165" width="180" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="750" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f59e0b" text-anchor="middle">Anthropic Claude</text>
    <text x="750" y="220" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">input_schema</text>
  </g>
  <line x1="660" y1="200" x2="505" y2="160" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
</svg>